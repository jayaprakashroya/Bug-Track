<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BugTrack - Login</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main class="login-container">
      <header class="logo">
        <div class="logo-icon" aria-hidden="true">&#128030;</div>
        <h1>BugTrack</h1>
        <p>Bug Tracking &amp; Management System</p>
      </header>

      <form id="loginForm" novalidate>
        <div id="loginMessage" class="message" role="alert" hidden></div>

        <div class="form-group">
          <label for="username">Username</label>
          <input
            id="username"
            name="username"
            type="text"
            placeholder="Enter your username"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-box">
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
            <button
              id="togglePassword"
              class="show-password"
              type="button"
              aria-controls="password"
              aria-pressed="false"
            >
              Show
            </button>
          </div>
        </div>

        <div class="options">
          <label class="remember" for="remember">
            <input id="remember" name="remember" type="checkbox" />
            Remember me
          </label>
          <a id="forgotPassword" href="#forgot-password">Forgot password?</a>
        </div>

        <button type="submit" class="login-btn">Log in</button>
      </form>

      <footer class="footer">&copy; 2026 BugTrack. All rights reserved.</footer>
    </main>

    <script src="login.js" defer></script>
  </body>
</html>
